<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="css/style.cad.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="/js/lucide-local.js"></script>
</head>
<body>
    <main class="auth-page">
        <div class="container">
            <header class="header">
                <div class="logo-box">
                    <img src="/images/LOGOPAPHD.png" alt="Logo Ponto a Ponto">
                </div>
                <h1>Criar Conta</h1>
                <p>Preencha seus dados para se cadastrar</p>
            </header>

            <section class="form-card">
                <form id="form-card">
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <div class="input-wrapper">
                            <i data-lucide="badge"></i>
                            <input type="text" id="cpf" placeholder="000.000.000-00" required>
                        </div>
                        <p id="msg-erro-cpf" class="msg-feedback"></p>
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail"></i>
                            <input type="email" id="email" placeholder="seu@email.com" required>
                        </div>
                        <p id="msg-erro-email" class="msg-feedback"></p>
                    </div>

                    <div class="input-group">
                        <label for="user">Nome</label>
                        <div class="input-wrapper">
                            <i data-lucide="user-round"></i>
                            <input type="text" id="user" placeholder="Digite seu nome" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="nickname">Nickname</label>
                        <div class="input-wrapper">
                            <i data-lucide="at-sign"></i>
                            <input type="text" id="nickname" placeholder="Digite seu nickname" required>
                        </div>
                        <p id="msg-erro-nickname" class="msg-feedback"></p>
                    </div>

                    <div class="input-group">
                        <label for="pass">Senha</label>
                        <div class="input-wrapper input-wrapper-password">
                            <i data-lucide="lock"></i>
                            <input type="password" id="pass" placeholder="Mínimo 8 caracteres" required>
                            <button type="button" class="password-toggle" data-toggle-password="pass" aria-label="Mostrar ou ocultar senha">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirm-pass">Confirmar Senha</label>
                        <div class="input-wrapper input-wrapper-password">
                            <i data-lucide="lock"></i>
                            <input type="password" id="confirm-pass" placeholder="Digite a senha novamente" required>
                            <button type="button" class="password-toggle" data-toggle-password="confirm-pass" aria-label="Mostrar ou ocultar senha">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" disabled>Cadastrar</button>
                </form>
            </section>

            <a href="/login" class="footer-link">
                <i data-lucide="arrow-left"></i>
                Voltar para o Login
            </a>
        </div>
    </main>

    <script>
      lucide.createIcons();
    </script>
    <script src="/js/script.js"></script>
</body>
</html>
